<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Нормоконтроль</title>
    <meta name="theme-color" content="#1f5a45" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12231c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Шрифт интерфейса (им набран весь первый экран) качаем сразу, параллельно со скриптом.
         Иначе браузер узнает о нём, только когда скрипт построит страницу, и первый экран
         дорисуется позже (Lighthouse: LCP). Шрифт текста работы — по мере нужды. -->
    <link
      rel="preload"
      href="/src/ui/fonts/golos-text-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/ui/fonts/golos-text-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <main id="app" tabindex="-1"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
