name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # lint + format:check + typecheck + тесты с покрытием + сборка.
      # Тесты по fixtures/real/*.docx здесь пропускаются: файлов в репозитории нет.
      - run: npm run check
